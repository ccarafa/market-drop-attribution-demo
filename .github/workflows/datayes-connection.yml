name: DataYes connection check

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'One trading date to verify (YYYY-MM-DD)'
        required: true
        type: string
      ticker:
        description: 'One six-digit stock code'
        required: true
        default: '000001'
        type: string

permissions:
  contents: read

concurrency:
  group: datayes-connection-check
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check one stock and one date
        env:
          DATAYES_API_TOKEN: ${{ secrets.DATAYES_API_TOKEN }}
          PROBE_DATE: ${{ inputs.trade_date }}
          PROBE_TICKER: ${{ inputs.ticker }}
        run: >-
          python tools/check_datayes_connection.py
          --date "$PROBE_DATE" --ticker "$PROBE_TICKER"
          --output .runtime/datayes-connection.json
      - name: Save sanitized status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datayes-connection-status
          path: .runtime/datayes-connection.json
          if-no-files-found: ignore
          retention-days: 7
